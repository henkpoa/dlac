# Independent gate: run the headless Lua suite on every PR and on pushes to main,
# so an agent's PR is verified before merge (a second check beside the agent's own).

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Headless test suite
        run: lua5.4 tests/run_tests.lua

      - name: UI smoke-load
        run: lua5.4 tests/smoke_ui.lua

      - name: AscensionXI catalog and import regression
        run: lua5.4 tests/ascensionxi_catalog.lua

      - name: Saved gear repair regression
        run: lua5.4 tests/gear_repair.lua

      - name: Custom equipment native pipeline regression
        run: lua5.4 tests/custom_equipment.lua

      - name: Server pack item icon regression
        run: lua5.4 tests/itemicons.lua

      - name: Gear vault count regression
        run: lua5.4 tests/gearvault_counts.lua

      - name: Gear vault instance regression
        run: lua5.4 tests/gearvault_instances.lua
